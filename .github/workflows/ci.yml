# The regression gate, run on every push and pull request.
#
# The job mirrors what a developer runs locally (`make test`) rather than reimplementing
# it, so that CI and a working copy cannot disagree about what passing means. Everything
# specific to CI is here: caching, and the checks that the cache did not lie.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Verification is the expensive part of this repository, so superseded runs are cancelled
# rather than left to finish. `main` is excluded: its runs are what the cache is built
# from, and cancelling them would leave later pull requests to install F* themselves.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Installs the pinned F* into the cache, so that the jobs after it only restore it. It
  # is a job of its own because several jobs need the toolchain: on a pin change one of
  # them builds it (about an hour) instead of each.
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The toolchain is ~500 MB and changes only when the pin does, so it is cached on
      # the pin file.
      - name: Restore F* toolchain
        id: fstar-cache
        uses: actions/cache/restore@v4
        with:
          path: tools/fstar
          key: fstar-${{ runner.os }}-${{ hashFiles('tools/fstar-version.txt', 'tools/fstar-source.txt') }}
          lookup-only: true

      - name: Set up OCaml
        if: steps.fstar-cache.outputs.cache-hit != 'true'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3.0'

      - name: Install F* toolchain
        if: steps.fstar-cache.outputs.cache-hit != 'true'
        env:
          FSTAR_OPAM_DEPS: '1'
        run: |
          if [ -f tools/fstar-source.txt ]; then eval "$(opam env)"; fi
          make tools

      - name: Save F* toolchain
        if: steps.fstar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tools/fstar
          key: fstar-${{ runner.os }}-${{ hashFiles('tools/fstar-version.txt', 'tools/fstar-source.txt') }}

      # The Pulse support library takes about a quarter of an hour to verify, and the gate
      # and every harness job need it, so it is verified once here and cached on its
      # sources and the pin.
      - name: Look up the Pulse support library
        id: lib-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            pulse/_cache
            pulse/.depend
          key: pulselib-${{ runner.os }}-${{ hashFiles('tools/fstar-version.txt', 'tools/fstar-source.txt', 'pulse/*.fst', 'pulse/*.fsti', 'pulse/Makefile') }}
          lookup-only: true

      - name: Restore F* toolchain for the library
        if: steps.lib-cache.outputs.cache-hit != 'true' && steps.fstar-cache.outputs.cache-hit == 'true'
        uses: actions/cache/restore@v4
        with:
          path: tools/fstar
          key: fstar-${{ runner.os }}-${{ hashFiles('tools/fstar-version.txt', 'tools/fstar-source.txt') }}
          fail-on-cache-miss: true

      - name: Build the Pulse support library
        if: steps.lib-cache.outputs.cache-hit != 'true'
        run: |
          touch tools/fstar/bin/fstar.exe
          make lib

      - name: Save the Pulse support library
        if: steps.lib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            pulse/_cache
            pulse/.depend
          key: pulselib-${{ runner.os }}-${{ hashFiles('tools/fstar-version.txt', 'tools/fstar-source.txt', 'pulse/*.fst', 'pulse/*.fsti', 'pulse/Makefile') }}

  gate:
    needs: toolchain
    runs-on: ubuntu-latest
    # A full cold-cache gate is about fifteen minutes locally, plus about an hour to build
    # F* when a source pin misses the toolchain cache. The ceiling is here to turn
    # a proof that diverges -- an ordinary way for an SMT query to fail -- into a failure
    # in the first hour rather than one that runs for GitHub's six-hour default.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', 'Pal.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      # Installed and cached by the `toolchain` job.
      - name: Restore F* toolchain
        id: fstar-cache
        uses: actions/cache/restore@v4
        with:
          path: tools/fstar
          key: fstar-${{ runner.os }}-${{ hashFiles('tools/fstar-version.txt', 'tools/fstar-source.txt') }}
          fail-on-cache-miss: true

      # Extracted execution tests need OCaml even when the F* binary is cached.
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3.0'

      - name: Install extracted-runtime dependencies
        run: opam install --yes ocamlfind batteries pprint ppx_deriving ppx_deriving_yojson stdint yojson zarith

      # `make tools` builds tools/fstar/bin/fstar.exe from tools/fstar-version.txt, and a
      # restored cache defeats that rule: the archive keeps the toolchain's original
      # timestamps while `actions/checkout` stamps the pin file with the time of the
      # checkout, so the prerequisite is always newer than the target and every later
      # `make` re-downloads F* despite the cache hit. Restoring the ordering is all that
      # is needed, and it is a no-op when F* was just installed.
      - name: Mark the toolchain newer than its pin
        run: touch tools/fstar/bin/fstar.exe

      # The pin is the reason this repository can reproduce a proof at all, so CI asserts
      # it instead of assuming it. This also catches a cache entry that was restored under
      # the right key but holds the wrong build. A source pin (tools/fstar-source.txt)
      # names the merged commit install-fstar.sh recorded in tools/fstar/version.txt; otherwise the nightly's version string is
      # compared with tools/fstar-version.txt.
      - name: Check the toolchain matches the pin
        run: |
          if [ -f tools/fstar-source.txt ]; then
            pinned="$(sed -n 's/^result=//p' tools/fstar-source.txt | tr -d '[:space:]')"
            actual="$(tr -d '[:space:]' < tools/fstar/version.txt)"
          else
            pinned="nightly-$(tr -d '[:space:]' < tools/fstar-version.txt)"
            actual="$(tools/fstar/bin/fstar.exe --version | head -1 | cut -d' ' -f2-)"
          fi
          echo "pinned: $pinned"
          echo "actual: $actual"
          if [ -z "$pinned" ] || [ "$pinned" != "$actual" ]; then
            echo "::error::F* is $actual but the pin in tools/ says $pinned"
            exit 1
          fi

      - name: Build the translator
        run: make build

      # Verified and cached by the `toolchain` job. As with F*, the archive's timestamps
      # are older than the checkout's, so the restored files are stamped with one common
      # time: `make lib` then finds them up to date instead of verifying again.
      - name: Restore the Pulse support library
        uses: actions/cache/restore@v4
        with:
          path: |
            pulse/_cache
            pulse/.depend
          key: pulselib-${{ runner.os }}-${{ hashFiles('tools/fstar-version.txt', 'tools/fstar-source.txt', 'pulse/*.fst', 'pulse/*.fsti', 'pulse/Makefile') }}
          fail-on-cache-miss: true

      - name: Build the Pulse support library
        run: |
          t="$(date +%s.%N)"
          find pulse/_cache pulse/.depend -exec touch -d "@$t" {} +
          make lib

      # The whole gate: both acceptance trees (`test/` and `examples/`) and the samples,
      # each of which compiles its C# with the stock compiler and verifies the Pulse that
      # `palcs` generates from it, followed by the seven lints. This is the root target
      # rather than `make -C test`, so the lints also see what the emitter produced for
      # the examples. It runs one F* job per core. The dotnet-runtime sample is left to
      # the `dotnet-runtime` job: it is hours of verification sequentially, and a few of
      # its modules need most of a runner's memory.
      - name: Test
        run: opam exec -- make -j"$(nproc)" test SKIP_SAMPLES=dotnet-runtime

      # `make test` has already run these; naming the two anti-contortion detectors
      # (doc/translation.md §7.2) separately is for the CI summary, where "the compiler
      # mentions a test by name" and "a proof failed" should not look alike.
      - name: Compiler must not name any example
        run: ./test/no-example-names.sh

      - name: Every generated construct must trace to C#
        run: bash test/provenance-lint.sh

      # The third detector (R18.2). Named separately for the same reason: a reference to
      # a module that was never generated is a translator bug, not a failed proof, and it
      # is the one failure mode that can otherwise reach CI reporting `0 error(s)`.
      - name: Every emitted module reference must resolve
        run: bash test/module-refs.sh

  # One dependency-driven build for all collection units: separate matrix jobs would
  # translate and prove shared dependencies more than once. The top-level Makefile
  # discovers every harness and schedules each once, after its references.
  dotnet-runtime:
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', 'Pal.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore F* toolchain
        uses: actions/cache/restore@v4
        with:
          path: tools/fstar
          key: fstar-${{ runner.os }}-${{ hashFiles('tools/fstar-version.txt', 'tools/fstar-source.txt') }}
          fail-on-cache-miss: true

      # As in the gate: the restored archive is older than the checked-out pin file.
      - name: Mark the toolchain newer than its pin
        run: touch tools/fstar/bin/fstar.exe

      - name: Build the translator
        run: make build

      # Verified and cached by the `toolchain` job. As with F*, the archive's timestamps
      # are older than the checkout's, so the restored files are stamped with one common
      # time: `make lib` then finds them up to date instead of verifying again.
      - name: Restore the Pulse support library
        uses: actions/cache/restore@v4
        with:
          path: |
            pulse/_cache
            pulse/.depend
          key: pulselib-${{ runner.os }}-${{ hashFiles('tools/fstar-version.txt', 'tools/fstar-source.txt', 'pulse/*.fst', 'pulse/*.fsti', 'pulse/Makefile') }}
          fail-on-cache-miss: true

      - name: Build the Pulse support library
        run: |
          t="$(date +%s.%N)"
          find pulse/_cache pulse/.depend -exec touch -d "@$t" {} +
          make lib

      # Three F* processes on a 4-core, 16 GB runner: with `o=20` no module needs more than
      # about 4.5 GB (Dictionary.TryInsert), so three of the largest still fit.
      - name: Verify collection dependency graph
        env:
          OCAMLRUNPARAM: o=20
        run: make -C samples/dotnet-runtime -j3

  # `make test` already runs this, as the seventh lint. It is repeated here as its own job
  # because it needs no F* at all: an analyzer regression is reported in about three
  # minutes instead of waiting out a verification run. The gate remains the authority --
  # this job only makes it fail sooner.
  analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', 'Pal.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      # Not `dotnet build Pal.Tests.sln`: one project in that solution, the diagnostics
      # cases, is a collection of programs pal-csharp is supposed to *reject*, so it
      # cannot build and the script excludes it. See test/ide-build.sh.
      - name: Analyzer must be silent on accepted programs
        run: bash test/ide-build.sh
